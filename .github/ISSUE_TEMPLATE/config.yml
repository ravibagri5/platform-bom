blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/ravibagri5/platform-bom/security/advisories/new
    about: Report a security issue privately. Please do not open a public issue.
  - name: Question or help
    url: https://github.com/ravibagri5/platform-bom/discussions/categories/q-a
    about: Ask how something works. Maintainers convert real bugs into issues.
  - name: Idea or suggestion
    url: https://github.com/ravibagri5/platform-bom/discussions/categories/ideas
    about: Float an idea before filing an issue, so we can agree on the shape.
  - name: Show and tell
    url: https://github.com/ravibagri5/platform-bom/discussions/categories/show-and-tell
    about: Share your platform page, a release workflow or a screenshot.
  - name: Roadmap
    url: https://github.com/ravibagri5/platform-bom/blob/main/ROADMAP.md
    about: Check whether what you want is already planned before opening anything.
