  description: New evidence sources and better recognition

- name: "theme/version"
  color: "5319e7"
  description: Platform releases, drift and promotion

- name: "theme/advise"
  color: "5319e7"
  description: Upstream releases, end-of-life, advisories and compatibility

- name: "theme/history"
  color: "5319e7"
  description: Snapshots over time and what changed

- name: "theme/present"
  color: "5319e7"
