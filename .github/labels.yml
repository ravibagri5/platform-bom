# Label catalogue.
#
# This file is the source of truth. Edit it in a pull request; the labels
# workflow applies it to the repository when it merges to main. Labels created
# by hand in the UI will be removed.
#
# Colours are quoted because YAML reads unquoted hex such as 5319e7 as a number.
#
# Colour convention:
#   d73a4a red      type: bug
#   0e8a16 green    type: everything else
#   1d76db blue     area
#   5319e7 purple   theme (matches the roadmap themes)
#   b60205 crimson  priority and blockers
#   fbca04 yellow   status, needs something from someone
#   c5def5 pale     meta, community

# --- Type -------------------------------------------------------------------

- name: bug
  color: "d73a4a"
  description: Something does not work the way it should

- name: regression
  color: "d73a4a"
  description: Worked in an earlier release and no longer does

- name: enhancement
  color: "0e8a16"
  description: A new capability or an improvement to an existing one

- name: proposal
  color: "0e8a16"
  description: Needs a design agreed before it is built

- name: documentation
  color: "0e8a16"
  description: Docs, README or examples

- name: refactor
  color: "0e8a16"
  description: Internal change with no user-visible behaviour

- name: test
  color: "0e8a16"
  description: Test coverage or test infrastructure

- name: chore
  color: "0e8a16"
  description: Build, tooling, CI or repository maintenance

- name: dependencies
  color: "0e8a16"
  description: Dependency updates

- name: release
  color: "0e8a16"
  description: Release coordination

- name: "breaking change"
  color: "b60205"
  description: Changes the resource model or the CLI in a way that breaks users

