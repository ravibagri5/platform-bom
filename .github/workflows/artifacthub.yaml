name: Artifact Hub metadata

on:
  push:
    branches: [main]
    paths:
      - artifacthub-repo.yml
      - .github/workflows/artifacthub.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish repository metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: oras-project/setup-oras@v1

      - name: Push artifacthub-repo.yml to the chart repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/platform-bom:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
