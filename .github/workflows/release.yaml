name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Needed for keyless signing with cosign.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main and extract release notes
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are tagged on main only."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          notes() { awk -v want="$1" 'index($0, "## [" want "]") == 1 {f=1; next} f && /^## \[/ {exit} f {print}' CHANGELOG.md; }
          notes "$version" > "$RUNNER_TEMP/release-notes.md"
          # A release candidate may ship the Unreleased section instead of its own.
          case "$version" in *-*) grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md" || notes Unreleased > "$RUNNER_TEMP/release-notes.md" ;; esac
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no '## [$version]' section with content."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Package and publish Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm lint charts/platform-bom --strict
          helm package charts/platform-bom --version "$version" --app-version "$version" --destination dist
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/platform-bom-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          gh release upload "$GITHUB_REF_NAME" "dist/platform-bom-$version.tgz"
