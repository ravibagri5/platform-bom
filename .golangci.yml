version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    errcheck:
      # CLI output goes to stdout; a failed write there is not recoverable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
        - name: context-as-argument
        - name: unexported-return

    gocritic:
      disabled-checks:
        - ifElseChain

    gosec:
      excludes:
        # Paths come from CLI flags and the platform file, never from HTTP requests.
        - G304
        # Files written are YAML for Git and a cache of public GitHub releases.
        - G301
        - G306

  exclusions:
    rules:
      # Tests are allowed to be repetitive and to skip the doc comments.
      - path: _test\.go
        linters:
          - gosec
          - revive
          - unparam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ravibagri5/platform-bom
