apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inventories.pbom.dev
spec:
  group: pbom.dev
  scope: Namespaced
  names:
    plural: inventories
    singular: inventory
    kind: Inventory
    shortNames: [pbinventory]
    categories: [pbom]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Environment
          type: string
          jsonPath: .environment
        - name: Collected
          type: date
          jsonPath: .collectedAt
      schema:
        openAPIV3Schema:
          type: object
          required: [components]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
              enum: [Inventory]
            metadata:
              type: object
            environment:
              type: string
            collectedAt:
              type: string
              format: date-time
            cluster:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            components:
              type: array
              items:
                type: object
                x-kubernetes-preserve-unknown-fields: true
            errors:
              type: array
              items:
                type: string
