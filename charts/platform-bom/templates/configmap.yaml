apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-bom.fullname" . }}-platform
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
data:
  pbom.yaml: |
    {{- toYaml .Values.platform | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-bom.fullname" . }}-releases
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
data:
  {{- if .Values.releases }}
  {{- range $filename, $release := .Values.releases }}
  {{ $filename | quote }}: |
    {{- toYaml $release | nindent 4 }}
  {{- end }}
  {{- else }}
  {}
  {{- end }}