{{- /* Releases upgraded with --reuse-values from an older chart have no kubeconfigSecret. */}}
{{- $kubeconfigSecret := (default dict .Values.kubeconfigSecret).name }}
{{- $auth := default dict .Values.auth }}
{{- $authMode := default "none" $auth.mode }}
{{- $authHeader := default dict $auth.header }}
{{- $oidc := default dict $auth.oidc }}
{{- $clientSecret := default dict $oidc.clientSecret }}
{{- $sessionSecret := default dict $auth.sessionSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-bom.fullname" . }}
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-bom
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-bom
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "platform-bom.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pbom
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --addr=0.0.0.0:8080
            - --config=/config/pbom.yaml
            - --releases-dir=/releases
            - --components-dir=/components
            - {{ printf "--refresh-interval=%v" .Values.refreshInterval | quote }}
            - {{ printf "--auth=%s" $authMode | quote }}
            {{- if eq $authMode "header" }}
            - {{ printf "--auth-header=%s" (default "X-Forwarded-User" $authHeader.name) | quote }}
            {{- with $authHeader.trustedProxies }}
            - {{ printf "--auth-trusted-proxies=%s" (join "," .) | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $authMode "oidc" }}
            - {{ printf "--oidc-issuer=%s" (required "auth.oidc.issuer is required when auth.mode=oidc" $oidc.issuer) | quote }}
            - {{ printf "--oidc-client-id=%s" (required "auth.oidc.clientId is required when auth.mode=oidc" $oidc.clientId) | quote }}
            - {{ printf "--oidc-redirect-url=%s" (required "auth.oidc.redirectURL is required when auth.mode=oidc" $oidc.redirectURL) | quote }}
            {{- with $oidc.scopes }}
            - {{ printf "--oidc-scopes=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $oidc.usernameClaim }}
            - {{ printf "--oidc-username-claim=%s" . | quote }}
            {{- end }}
            {{- with $oidc.groupsClaim }}
            - {{ printf "--oidc-groups-claim=%s" . | quote }}
            {{- end }}
            {{- with $oidc.allowedGroups }}
            - {{ printf "--oidc-allowed-groups=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $auth.sessionDuration }}
            - {{ printf "--session-duration=%s" . | quote }}
            {{- end }}
            {{- end }}
          env:
            - name: XDG_CACHE_HOME
              value: /cache
            {{- if and (eq $authMode "oidc") $clientSecret.name }}
            - name: PBOM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $clientSecret.name }}
                  key: {{ default "client-secret" $clientSecret.key }}
            {{- end }}
            {{- if and (eq $authMode "oidc") $sessionSecret.name }}
            - name: PBOM_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $sessionSecret.name }}
                  key: {{ default "session-secret" $sessionSecret.key }}
            {{- end }}
            {{- if .Values.githubTokenSecret.name }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubTokenSecret.name }}
                  key: {{ .Values.githubTokenSecret.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: platform
              mountPath: /config
              readOnly: true
            - name: releases
              mountPath: /releases
              readOnly: true
            - name: components
              mountPath: /components
              readOnly: true
            - name: cache
              mountPath: /cache
            {{- if $kubeconfigSecret }}
            - name: kubeconfig
              mountPath: /kubeconfig
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: platform
          configMap:
            name: {{ include "platform-bom.configMapName" (dict "root" . "kind" "platform") }}
        - name: releases
          configMap:
            name: {{ include "platform-bom.configMapName" (dict "root" . "kind" "releases") }}
            optional: true
        - name: components
          configMap:
            name: {{ include "platform-bom.configMapName" (dict "root" . "kind" "components") }}
            optional: true
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        {{- if $kubeconfigSecret }}
        - name: kubeconfig
          secret:
            secretName: {{ $kubeconfigSecret }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}