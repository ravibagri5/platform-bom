{{- $metrics := default dict .Values.metrics }}
{{- $dash := default dict $metrics.grafanaDashboard }}
{{- if and $metrics.enabled $dash.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-bom.fullname" . }}-dashboard
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
    {{- with $dash.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $dash.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  platform-bom.json: |-
    {{- .Files.Get "dashboards/platform-bom.json" | nindent 4 }}
{{- end }}
