{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform-bom.serviceAccountName" . }}
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "platform-bom.rbacName" . }}
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  {{- if .Values.rbac.helmSecrets }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  {{- end }}
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [pkg.crossplane.io]
    resources: [providers, functions, configurations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platform-bom.rbacName" . }}
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "platform-bom.rbacName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform-bom.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}