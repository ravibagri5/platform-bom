{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform-bom.serviceAccountName" . }}
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "platform-bom.rbacName" . }}
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  {{- if .Values.rbac.helmSecrets }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  {{- end }}
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [pkg.crossplane.io]
    resources: [providers, functions, configurations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platform-bom.rbacName" . }}
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "platform-bom.rbacName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform-bom.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "platform-bom.rbacName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
rules:
  - apiGroups: [pbom.dev]
    resources: [platforms, platformreleases, components, inventories]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "platform-bom.rbacName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-bom.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "platform-bom.rbacName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform-bom.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}