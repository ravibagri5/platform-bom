image:
  repository: ghcr.io/ravibagri5/platform-bom
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

rbac:
  create: true
  helmSecrets: true
serviceAccount:
  create: true
  name: ""

service:
  port: 80
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
refreshInterval: 10m
githubTokenSecret:
  name: ""
  key: token

platform:
  apiVersion: pbom.dev/v1alpha1
  kind: Platform
  metadata:
    name: my-platform
    displayName: My Platform
  spec:
    releasesDir: /releases
    environments:
      - name: this-cluster
        displayName: This cluster
        inCluster: true

releases: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi