image:
  repository: ghcr.io/ravibagri5/platform-bom
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

rbac:
  create: true
  helmSecrets: true
serviceAccount:
  create: true
  name: ""
  # Cloud workload identity, for example azure.workload.identity/client-id,
  # eks.amazonaws.com/role-arn or iam.gke.io/gcp-service-account.
  annotations: {}
# Azure Workload Identity also needs azure.workload.identity/use: "true".
podLabels: {}

service:
  port: 80
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
refreshInterval: 10m
githubTokenSecret:
  name: ""
  key: token
# CNCF landscape used to name and categorise Helm releases the catalog does not
# know. If it cannot be downloaded, the snapshot built into PBOM is used.
# Set an internal mirror, or "" to use only the snapshot.
landscapeURL: https://raw.githubusercontent.com/cncf/landscape/master/landscape.yml

# Who may open the UI and API. none: anyone who can reach the Service.
# header: the user named in a header set by an authenticating proxy.
# oidc: sign-in with an OpenID Connect provider such as Entra ID, Okta,
# Keycloak, Dex or Google.
auth:
  mode: none
  header:
    name: X-Forwarded-User
    # CIDRs the proxy connects from; requests from elsewhere are refused.
    trustedProxies: []
  oidc:
    issuer: ""
    clientId: ""
    # Existing Secret with the client secret; leave name empty for a public client.
    clientSecret:
      name: ""
      key: client-secret
    # Public URL of the callback, such as https://pbom.example.com/auth/callback.
    redirectURL: ""
    scopes: [openid, profile, email]
    usernameClaim: ""
    groupsClaim: groups
    # Only members of these groups may sign in; empty allows anyone the provider signs in.
    allowedGroups: []
  # Existing Secret with at least 32 random bytes that encrypts session cookies.
  # Without it, users sign in again whenever the pod restarts.
  sessionSecret:
    name: ""
    key: session-secret
  sessionDuration: 12h

# Existing Secret with a kubeconfig for other clusters, mounted read-only at
# /kubeconfig. Environments use it with kubeconfig: /kubeconfig/<key> and
# kubeContext. Token updates are picked up at the next discovery.
kubeconfigSecret:
  name: ""

# Extend the pod without forking the chart, for example an init container that
# copies a kubeconfig credential plugin into an emptyDir mounted in the pod.
# Names cache and kubeconfig are used by the chart.
extraInitContainers: []
extraVolumes: []
extraVolumeMounts: []

# Render the Platform, PlatformRelease and Component resources below.
# Set false when those resources are managed separately (for example, by GitOps).
crdResources:
  create: true

# The platform PBOM presents. Until you set spec.description and spec.offerings,
# PBOM drafts them from what it discovers; "pbom init" writes a commented
# platform.yaml to start from (see docs/getting-started.md).
platform:
  apiVersion: pbom.dev/v1alpha1
  kind: Platform
  metadata:
    name: my-platform
    displayName: My Platform
  spec:
    environments:
      # The cluster PBOM runs in, read with its own service account.
      - name: this-cluster
        displayName: This cluster
        inCluster: true

# File name -> PlatformRelease document, or raw file content (helm --set-file).
releases: {}

# File name -> Component document(s), or raw file content. Mounted as
# componentsDir; definitions override built-in catalog entries with the same name.
components: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi