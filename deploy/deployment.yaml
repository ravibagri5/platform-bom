apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbom
  labels:
    app.kubernetes.io/name: platform-bom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-bom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-bom
    spec:
      serviceAccountName: pbom
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pbom
          image: ghcr.io/ravibagri5/platform-bom
          args:
            - serve
            - --addr=0.0.0.0:8080
            - --config=/config/pbom.yaml
            - --refresh-interval=10m
          env:
            # Upstream release data is cached here.
            - name: XDG_CACHE_HOME
              value: /cache
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pbom-github
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: platform
              mountPath: /config
              readOnly: true
            - name: releases
              mountPath: /releases
              readOnly: true
            - name: cache
              mountPath: /cache
            # For other clusters, mount a kubeconfig Secret (see README):
            # - name: kubeconfig
            #   mountPath: /kubeconfig
            #   readOnly: true
      volumes:
        - name: platform
          configMap:
            name: pbom-platform
        - name: releases
          configMap:
            name: pbom-releases
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        # - name: kubeconfig
        #   secret:
        #     secretName: pbom-kubeconfig
