apiVersion: pbom.dev/v1alpha1
kind: Platform
metadata:
  name: my-platform
  displayName: My Platform
spec:
  tagline: Replace this with what your platform offers.
  readmeFile: PLATFORM.md
  # Mounted from the pbom-releases ConfigMap.
