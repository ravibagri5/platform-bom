# A service account with a long-lived token for a central PBOM, bound to the
# ClusterRole in remote-reader-role.yaml. hack/remote-kubeconfig.sh applies
# both and writes the matching kubeconfig context.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-bom
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pbom-reader
  namespace: platform-bom
---
# Long-lived token for the kubeconfig. Delete the Secret to revoke it.
apiVersion: v1
kind: Secret
metadata:
  name: pbom-reader-token
  namespace: platform-bom
  annotations:
    kubernetes.io/service-account.name: pbom-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pbom-remote-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pbom-remote-reader
subjects:
  - kind: ServiceAccount
    name: pbom-reader
    namespace: platform-bom
