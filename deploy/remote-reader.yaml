# Read-only discovery access for a central PBOM, applied to each cluster it
# reaches through a kubeconfig. hack/remote-kubeconfig.sh applies this and
# writes the matching kubeconfig context.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-bom
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pbom-reader
  namespace: platform-bom
---
# Long-lived token for the kubeconfig. Delete the Secret to revoke it.
apiVersion: v1
kind: Secret
metadata:
  name: pbom-reader-token
  namespace: platform-bom
  annotations:
    kubernetes.io/service-account.name: pbom-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pbom-remote-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  # Helm stores release metadata in Secrets, and RBAC cannot restrict by label.
  # Remove this rule to skip Helm discovery; everything else keeps working.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [pkg.crossplane.io]
    resources: [providers, functions, configurations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pbom-remote-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pbom-remote-reader
subjects:
  - kind: ServiceAccount
    name: pbom-reader
    namespace: platform-bom
