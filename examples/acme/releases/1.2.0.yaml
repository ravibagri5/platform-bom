apiVersion: pbom.dev/v1alpha1
kind: PlatformRelease
metadata:
  name: "1.2.0"
spec:
  version: "1.2.0"
  date: "2026-09-15"
  summary: Azure infrastructure, Kubernetes 1.34 and composition functions.
  highlights:
    - Kubernetes upgraded to 1.34
    - Self-service Azure infrastructure alongside AWS
    - Compositions moved to functions (patch-and-transform, auto-ready)
    - Karpenter 1.6 with improved consolidation
  notes: |
    ### Breaking changes

    - `provider-upjet-aws` 2.0 renames a handful of fields on `rds` resources. Platform compositions are updated;
      direct managed resource users should review the [upstream release notes](https://github.com/crossplane-contrib/provider-upjet-aws/releases).
  components:
    kubernetes: "1.34"
    argocd: "3.1.5"
    crossplane: "2.0.2"
    provider-upjet-aws: "2.0.0"
    provider-upjet-azure: "2.0.0"
    function-patch-and-transform: "0.9.0"
    function-auto-ready: "0.5.0"
    karpenter: "1.6.2"
    cert-manager: "1.18.2"
    external-secrets: "0.19.2"
    kyverno: "1.15.1"
    istio: "1.27.1"
    prometheus-operator: "0.85.0"
  offerings: [kubernetes-workloads, autoscaling, ingress, metrics, secrets, policy, postgresql, object-storage, gitops, app-templates]
