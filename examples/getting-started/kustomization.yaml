apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-bom

# Fixed names, so the PBOM pod keeps mounting the same ConfigMaps and reloads
# when their content changes.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: pbom-platform
    files:
      - pbom.yaml=platform.yaml
      # Exported inventories for clusters PBOM cannot reach:
      # - inventories/edge.yaml
  - name: pbom-releases
    files:
      - releases/1.0.0.yaml
  - name: pbom-components
    files:
      - components/internal-gateway.yaml
