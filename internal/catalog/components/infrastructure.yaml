apiVersion: pbom.dev/v1alpha1
kind: Component
metadata:
  name: crossplane
spec:
  displayName: Crossplane
  category: infrastructure
  description: Control plane framework for self-service infrastructure.
  homepage: https://crossplane.io
  discovery:
    images: ["crossplane/crossplane"]
    helmCharts: ["crossplane"]
    apiGroups: ["apiextensions.crossplane.io", "pkg.crossplane.io"]
  upstream:
    github: crossplane/crossplane
---
apiVersion: pbom.dev/v1alpha1
kind: Component
metadata:
  name: provider-upjet-aws
spec:
  displayName: Crossplane Provider AWS
  category: infrastructure
  description: Crossplane provider family for AWS.
  partOf: crossplane
  homepage: https://marketplace.upbound.io/providers/upbound/provider-family-aws
  discovery:
    crossplanePackages: ["upbound/provider-aws-*", "upbound/provider-family-aws", "crossplane-contrib/provider-aws-*", "crossplane-contrib/provider-family-aws"]
  upstream:
    github: crossplane-contrib/provider-upjet-aws
---
