apiVersion: pbom.dev/v1alpha1
kind: Component
metadata:
  name: platform-bom
spec:
  displayName: Platform BOM
  category: observability
  description: Platform inventory, release drift and upstream updates.
  homepage: https://github.com/ravibagri5/platform-bom
  discovery:
    images: ["ravibagri5/platform-bom"]
    helmCharts: ["platform-bom"]
  upstream:
    github: ravibagri5/platform-bom
---
apiVersion: pbom.dev/v1alpha1
kind: Component
metadata:
  name: prometheus-operator
spec:
  displayName: Prometheus Operator
  category: observability
  description: Kubernetes-native Prometheus management.
  homepage: https://prometheus-operator.dev
  discovery:
    images: ["prometheus-operator/prometheus-operator"]
    helmCharts: ["kube-prometheus-stack"]
    apiGroups: ["monitoring.coreos.com"]
  upstream:
    github: prometheus-operator/prometheus-operator
