---
apiVersion: pbom.dev/v1alpha1
kind: Component
metadata:
  name: external-secrets
spec:
  displayName: External Secrets
  category: security
  description: Sync secrets from external secret stores.
  homepage: https://external-secrets.io
  discovery:
    images: ["external-secrets/external-secrets"]
    helmCharts: ["external-secrets"]
    apiGroups: ["external-secrets.io"]
  upstream:
    github: external-secrets/external-secrets
---
apiVersion: pbom.dev/v1alpha1
kind: Component
metadata:
  name: vault
spec:
  displayName: HashiCorp Vault
  category: security
  description: Secrets management.
  homepage: https://www.vaultproject.io
  discovery:
    images: ["hashicorp/vault"]
    helmCharts: ["vault"]
  upstream:
    github: hashicorp/vault
---
