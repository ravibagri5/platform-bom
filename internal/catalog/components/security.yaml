apiVersion: pbom.dev/v1alpha1
kind: Component
metadata:
  name: cert-manager
spec:
  displayName: cert-manager
  category: security
  description: X.509 certificate management.
  homepage: https://cert-manager.io
  discovery:
    images: ["jetstack/cert-manager-controller"]
    helmCharts: ["cert-manager"]
    apiGroups: ["cert-manager.io"]
  upstream:
    github: cert-manager/cert-manager
---
apiVersion: pbom.dev/v1alpha1
kind: Component
metadata:
  name: kyverno
spec:
  displayName: Kyverno
  category: security
  description: Kubernetes-native policy engine.
  homepage: https://kyverno.io
  discovery:
    images: ["kyverno/kyverno"]
    helmCharts: ["kyverno"]
    apiGroups: ["kyverno.io"]
  upstream:
    github: kyverno/kyverno
---
apiVersion: pbom.dev/v1alpha1
kind: Component
metadata:
  name: gatekeeper
spec:
  displayName: OPA Gatekeeper
  category: security
  description: Policy controller built on Open Policy Agent.
  homepage: https://open-policy-agent.github.io/gatekeeper
  discovery:
    images: ["openpolicyagent/gatekeeper"]
    helmCharts: ["gatekeeper"]
    apiGroups: ["templates.gatekeeper.sh"]
  upstream:
