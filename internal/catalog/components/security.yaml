kind: Component
metadata:
  name: vault-secrets-operator
spec:
  displayName: Vault Secrets Operator
  category: security
  description: Sync secrets from HashiCorp Vault into Kubernetes.
  homepage: https://developer.hashicorp.com/vault/docs/platform/k8s/vso
  discovery:
    images: ["hashicorp/vault-secrets-operator"]
    helmCharts: ["vault-secrets-operator"]
    apiGroups: ["secrets.hashicorp.com"]
  upstream:
    github: hashicorp/vault-secrets-operator
